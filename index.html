<!DOCTYPE html>

<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EWIG Hochzeitsdeko – Bald verfügbar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cormorant:ital,wght@0,300;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }


:root {
  --gold:       #B8965A;
  --gold-light: #D4B07A;
  --gold-pale:  #E8D5B0;
  --cream:      #FAF8F3;
  --cream-dark: #F0EBE0;
  --ink:        #2C2418;
  --ink-soft:   #6B5F4E;
}

html, body {
  height: 100%;
  background: var(--cream);
  color: var(--ink);
  font-family: 'Cormorant Garamond', Georgia, serif;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 100;
  opacity: 0.6;
}

.corner {
  position: fixed;
  width: 80px;
  height: 80px;
  opacity: 0;
  animation: fadeIn 1.2s ease forwards;
}
.corner--tl { top: 24px; left: 24px; border-top: 1px solid var(--gold); border-left: 1px solid var(--gold); animation-delay: 0.8s; }
.corner--tr { top: 24px; right: 24px; border-top: 1px solid var(--gold); border-right: 1px solid var(--gold); animation-delay: 0.9s; }
.corner--bl { bottom: 24px; left: 24px; border-bottom: 1px solid var(--gold); border-left: 1px solid var(--gold); animation-delay: 1.0s; }
.corner--br { bottom: 24px; right: 24px; border-bottom: 1px solid var(--gold); border-right: 1px solid var(--gold); animation-delay: 1.1s; }

.stage {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 32px;
  text-align: center;
  position: relative;
}

.stage::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -55%);
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(184,150,90,0.10) 0%, transparent 70%);
  pointer-events: none;
}

.ornament {
  display: flex;
  align-items: center;
  gap: 16px;
  opacity: 0;
  animation: riseUp 1s ease forwards;
  animation-delay: 0.2s;
}
.ornament__line {
  width: 60px;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--gold));
}
.ornament__line--r {
  background: linear-gradient(to left, transparent, var(--gold));
}
.ornament__diamond {
  width: 6px;
  height: 6px;
  background: var(--gold);
  transform: rotate(45deg);
}

.logo {
  margin: 28px 0 12px;
  opacity: 0;
  animation: riseUp 1.1s ease forwards;
  animation-delay: 0.4s;
  position: relative;
  z-index: 1;
}
.logo__ewig {
  display: block;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(72px, 18vw, 130px);
  letter-spacing: 0.25em;
  line-height: 1;
  color: var(--gold);
  text-transform: uppercase;
}
.logo__sub {
  display: block;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(11px, 2.5vw, 14px);
  letter-spacing: 0.45em;
  color: var(--ink-soft);
  text-transform: uppercase;
  margin-top: 4px;
}

.divider {
  width: 1px;
  height: 48px;
  background: linear-gradient(to bottom, transparent, var(--gold-pale), transparent);
  margin: 28px auto;
  opacity: 0;
  animation: fadeIn 1s ease forwards;
  animation-delay: 0.8s;
}

.headline {
  font-weight: 300;
  font-size: clamp(22px, 5vw, 34px);
  letter-spacing: 0.08em;
  color: var(--ink);
  line-height: 1.4;
  max-width: 500px;
  opacity: 0;
  animation: riseUp 1s ease forwards;
  animation-delay: 0.7s;
}
.headline em {
  font-style: italic;
  color: var(--gold);
}

.body {
  margin-top: 20px;
  font-size: clamp(15px, 3vw, 18px);
  font-weight: 300;
  line-height: 1.8;
  color: var(--ink-soft);
  max-width: 420px;
  opacity: 0;
  animation: riseUp 1s ease forwards;
  animation-delay: 0.9s;
}

.contact {
  margin-top: 40px;
  opacity: 0;
  animation: riseUp 1s ease forwards;
  animation-delay: 1.1s;
}
.contact__label {
  font-size: 11px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 10px;
}
.contact__link {
  display: inline-block;
  padding: 12px 32px;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.15em;
  text-decoration: none;
  transition: background 0.3s, color 0.3s;
}
.contact__link:hover {
  background: var(--gold);
  color: var(--cream);
}

.bottom-ornament {
  margin-top: 52px;
  opacity: 0;
  animation: fadeIn 1.2s ease forwards;
  animation-delay: 1.3s;
}
.bottom-ornament svg {
  width: 120px;
  opacity: 0.45;
}

@keyframes riseUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

@media (max-width: 480px) {
  .corner { width: 50px; height: 50px; }
  .stage { padding: 60px 24px; }
}


  </style>
</head>
<body>

  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <main class="stage">


<div class="ornament">
  <span class="ornament__line"></span>
  <span class="ornament__diamond"></span>
  <span class="ornament__line ornament__line--r"></span>
</div>

<div class="logo">
  <span class="logo__ewig">EWIG</span>
  <span class="logo__sub">Hochzeitsdeko</span>
</div>

<div class="divider"></div>

<h1 class="headline">
  Schöne Momente verdienen<br>
  <em>schöne Dinge.</em>
</h1>

<p class="body">
  Handgefertigte 3D-Drucke für den schönsten Tag Ihres Lebens.
  Unser Shop öffnet bald — individuell, zeitlos und <em style="color:var(--gold)">ewig</em>.
</p>

<div class="contact">
  <p class="contact__label">Anfragen &amp; Vorbestellungen</p>
  <a class="contact__link" href="mailto:hallo@ewig-deko.de">hallo@ewig-deko.de</a>
</div>

<div class="bottom-ornament">
  <svg viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M100 30 C100 30 85 10 70 10 C55 10 40 20 40 30 C40 40 55 50 70 50 C85 50 100 30 100 30 Z" stroke="#B8965A" stroke-width="1.2" fill="none"/>
    <path d="M100 30 C100 30 115 10 130 10 C145 10 160 20 160 30 C160 40 145 50 130 50 C115 50 100 30 100 30 Z" stroke="#B8965A" stroke-width="1.2" fill="none"/>
    <circle cx="100" cy="30" r="2.5" fill="#B8965A"/>
    <line x1="10" y1="30" x2="35" y2="30" stroke="#B8965A" stroke-width="0.8" opacity="0.6"/>
    <line x1="165" y1="30" x2="190" y2="30" stroke="#B8965A" stroke-width="0.8" opacity="0.6"/>
    <circle cx="10" cy="30" r="1.5" fill="#B8965A" opacity="0.5"/>
    <circle cx="190" cy="30" r="1.5" fill="#B8965A" opacity="0.5"/>
  </svg>
</div>


  </main>

</body>
</html>
